{% extends 'base.html' %}
{% block title %}Register Student{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="d-flex align-items-center mb-4">
        <a href="{{ url_for('students_list') }}" class="btn btn-outline-secondary btn-sm me-3">
          <i class="bi bi-arrow-left"></i>
        </a>
        <div>
          <h3 class="fw-bold mb-0">Register New Student</h3>
          <p class="text-muted small mb-0">FR-002: Enroll student details into centralized registry</p>
        </div>
      </div>

      <div class="card card-custom p-4">
        <form method="POST" action="{{ url_for('register_student') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Roll / Enrolment Number <span class="text-danger">*</span></label>
            <input type="text" name="roll_no" class="form-control" placeholder="e.g. CS109, IT205" value="{{ roll_no or '' }}" required autofocus>
            <small class="text-muted">Unique identifier for the student. Duplicates will be rejected.</small>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Full Student Name <span class="text-danger">*</span></label>
            <input type="text" name="full_name" class="form-control" placeholder="e.g. Maya Lin" value="{{ full_name or '' }}" required>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Class / Section <span class="text-danger">*</span></label>
            <input type="text" name="class_name" class="form-control" placeholder="e.g. CS-A, IT-B, 4th-Sem-CSE" value="{{ class_name or '' }}" required>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('students_list') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary-custom">
              <i class="bi bi-camera me-1"></i> Save &amp; Proceed to Face Capture
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
