{% extends 'base.html' %}
{% block title %}Edit Student - {{ student.full_name }}{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="d-flex align-items-center mb-4">
        <a href="{{ url_for('students_list') }}" class="btn btn-outline-secondary btn-sm me-3">
          <i class="bi bi-arrow-left"></i>
        </a>
        <div>
          <h3 class="fw-bold mb-0">Edit Student Record</h3>
          <p class="text-muted small mb-0">Modify information for {{ student.full_name }}</p>
        </div>
      </div>

      <div class="card card-custom p-4">
        <form method="POST" action="{{ url_for('edit_student', student_id=student.student_id) }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Roll / Enrolment Number</label>
            <input type="text" name="roll_no" class="form-control" value="{{ student.roll_no }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Full Student Name</label>
            <input type="text" name="full_name" class="form-control" value="{{ student.full_name }}" required>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Class / Section</label>
            <input type="text" name="class_name" class="form-control" value="{{ student.class_name }}" required>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('capture_face_samples', student_id=student.student_id) }}" class="btn btn-outline-primary">
              <i class="bi bi-camera me-1"></i> Manage Face Samples
            </a>
            <div class="d-flex gap-2">
              <a href="{{ url_for('students_list') }}" class="btn btn-outline-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary-custom">Update Details</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
